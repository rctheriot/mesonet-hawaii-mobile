name: CI

# Quality gate for the dev and main branches. Cloudflare Pages owns the actual
# build-and-deploy on push to main; this workflow exists to catch broken types,
# failing tests, or a broken production build *before* they reach main.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One leg per region. The app is built from a single repo with the region
      # selected by VITE_APP_DATA, so a config change that breaks one region's
      # build is exactly the failure this workflow exists to catch.
      matrix:
        region: [hawaii, american_samoa]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Region-independent (the suites drive region config explicitly), so this
      # runs identically on every matrix leg — cheap enough to leave in place.
      - name: Unit tests
        run: npm test

      # `npm run build` is `tsc -b && vite build` — covers typecheck + production build.
      # No API key needed: it's only read at runtime, so the bundle builds fine without it.
      - name: Typecheck & build (${{ matrix.region }})
        run: npm run build
        env:
          VITE_APP_DATA: ${{ matrix.region }}
